<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>工作回顾</title>
  <style>
    :root { color-scheme:light; --bg:#fff; --fg:#202020; --muted:#777b82; --line:#e9e9e9; --hover:#f1f1f1; --danger:#a64135; --focus:#5f83be; --font:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif); }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#1b1b1b; --fg:#ededed; --muted:#9b9da3; --line:#343434; --hover:#303030; --danger:#ef9f92; --focus:#8cacdd; }
    @media(prefers-color-scheme:dark) { :root:not([data-theme="light"]) { color-scheme:dark; --bg:#1b1b1b; --fg:#ededed; --muted:#9b9da3; --line:#343434; --hover:#303030; --danger:#ef9f92; --focus:#8cacdd; } }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--bg); color:var(--fg); }
    body { font-family:var(--font); font-size:14px; line-height:1.85; overflow-wrap:anywhere; }
    [hidden] { display:none !important; }
    .shell { width:100%; max-width:760px; margin:0 auto; padding:18px 20px 20px; }
    .header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding-bottom:14px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:16px; font-weight:600; letter-spacing:-.3px; line-height:1.5; }
    .meta { display:flex; flex-wrap:wrap; gap:4px 9px; margin-top:4px; color:var(--muted); font-size:11px; line-height:1.6; }
    .pause-button { width:26px; height:26px; flex:none; display:grid; place-items:center; border:0; border-radius:5px; padding:0; background:transparent; color:var(--muted); cursor:pointer; touch-action:manipulation; }
    .pause-button:not(:disabled):hover { background:var(--hover); }
    .pause-button:disabled { opacity:.4; cursor:default; }
    .pause-button:focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
    .icon { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .overview { margin:16px 0 0; white-space:pre-wrap; }
    .empty { color:var(--muted); font-size:13px; }
    .failure-note { margin:13px 0 0; color:var(--danger); font-size:11px; line-height:1.7; }
    @media(min-width:760px) { .shell { padding:24px 32px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div><h1>工作回顾</h1><div class="meta"><span id="period"></span><span id="last-time"></span></div></div>
      <button id="pause" class="pause-button" type="button" title="暂停自动总结" aria-label="暂停自动总结" disabled><svg id="pause-icon" class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5v11M13 4.5v11"/></svg></button>
    </header>
    <main><p id="overview" class="overview empty">新的工作进展会自动整理在这里。</p><p id="failure-note" class="failure-note" hidden>总结暂时无法更新，稍后会继续检查。</p></main>
  </div>
  <script>
    'use strict';
    (() => {
      const refs=Object.fromEntries(['period','last-time','overview','failure-note','pause','pause-icon'].map(id=>[id,document.getElementById(id)]));
      const states=new Set(['idle','collecting','summarizing','ready','paused','error']);
      const asText=value=>typeof value==='string'?value:value==null?'':String(value);
      const setText=(node,value)=>{const text=asText(value);if(node.textContent!==text)node.textContent=text;};
      let current=null, transport=null, connected=false, busy=false, polling=false, ended=false, hostContext={};
      let sequence=0, requestSequence=0, pollTimer=null, sizeFrame=null, peerOrigin='*', authToken='';
      const pending=new Map();
      const isEmbedded=window.parent!==window;
      const isLocalHttp=/^https?:$/.test(location.protocol)&&['localhost','127.0.0.1','[::1]'].includes(location.hostname);
      function normalize(value) {
        if(!value||typeof value!=='object'||!states.has(value.state))throw new Error('回顾服务返回了无法识别的状态');
        const summary=value.summary&&typeof value.summary==='object'?value.summary:null;
        const retained=['collecting','summarizing','error'].includes(value.state)?current?.summary:null;
        return {state:value.state,paused:Boolean(value.paused),summary:summary||retained||null};
      }
      function unwrap(value) {
        if(value?.isError)throw new Error('操作暂时未完成');
        if(states.has(value?.state))return value;
        const structured=value?.structuredContent;
        if(states.has(structured?.state))return structured;
        if(states.has(structured?.state?.state))return structured.state;
        for(const item of value?.content||[]) {if(item.type!=='text')continue;try{const parsed=JSON.parse(item.text);if(states.has(parsed?.state))return parsed;}catch(_){} }
        return null;
      }
      function timestamp(value) {
        const date=new Date(value);if(!value||!Number.isFinite(date.getTime()))return '';
        try{return new Intl.DateTimeFormat('zh-CN',{timeZone:hostContext.timeZone||'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}).format(date);}catch(_){return '';}
      }
      function displayPeriod(summary) {
        const label=asText(summary.period_label)||'最近';const date=new Date(summary.generated_at);
        if(label.includes('含未读进展'))return '最近的工作';
        if(!Number.isFinite(date.getTime())||!label.startsWith('今天'))return label;
        try {
          const options={timeZone:hostContext.timeZone||'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'};
          const day=new Intl.DateTimeFormat('zh-CN',options);
          if(day.format(date)!==day.format(new Date()))return label.replace(/^今天/,new Intl.DateTimeFormat('zh-CN',{timeZone:options.timeZone,month:'numeric',day:'numeric'}).format(date));
        }catch(_){}
        return label;
      }
      function render() {
        const summary=current?.summary;const overview=asText(summary?.overview).trim();const paused=Boolean(current?.paused);
        refs.overview.classList.toggle('empty',!overview);
        setText(refs.overview,overview||(paused?'自动总结已暂停。':'新的工作进展会自动整理在这里。'));
        setText(refs.period,summary?displayPeriod(summary):'');const time=timestamp(summary?.generated_at);setText(refs['last-time'],time?time+' 更新':'');
        refs['failure-note'].hidden=current?.state!=='error';
        const label=paused?'恢复自动总结':'暂停自动总结';refs.pause.title=label;refs.pause.setAttribute('aria-label',label);refs.pause.setAttribute('aria-pressed',String(paused));refs.pause.disabled=!connected||busy;
        refs['pause-icon'].firstElementChild.setAttribute('d',paused?'m7 4 8 6-8 6Z':'M7 4.5v11M13 4.5v11');
      }
      function accept(value) {if(!value)return false;current=normalize(value);connected=true;render();return true;}
      function showError() {current={state:'error',paused:current?.paused||false,summary:current?.summary||null};render();}
      function notify(method,params={}) {if(transport==='mcp'&&!ended)window.parent.postMessage({jsonrpc:'2.0',method,params},peerOrigin);}
      function rpc(method,params={},timeout=20000) {
        return new Promise((resolve,reject)=>{const id='recap-'+(++sequence);const timer=setTimeout(()=>{pending.delete(id);reject(new Error('连接暂时没有响应'));},timeout);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},peerOrigin);});
      }
      function applyContext(context) {
        hostContext={...hostContext,...context};if(['light','dark'].includes(hostContext.theme))document.documentElement.dataset.theme=hostContext.theme;
        const allowed=['--color-background-primary','--color-text-primary','--color-text-secondary','--color-border-primary','--font-sans'];
        for(const key of allowed){const value=hostContext.styles?.variables?.[key];if(typeof value==='string')document.documentElement.style.setProperty(key,value);}
        const aliases={'--bg':'--color-background-primary','--fg':'--color-text-primary','--muted':'--color-text-secondary','--line':'--color-border-primary'};
        for(const [alias,key]of Object.entries(aliases))if(typeof hostContext.styles?.variables?.[key]==='string')document.documentElement.style.setProperty(alias,'var('+key+')');
        render();
      }
      function cleanup(){ended=true;clearInterval(pollTimer);cancelAnimationFrame(sizeFrame);for(const item of pending.values()){clearTimeout(item.timer);item.reject(new Error('回顾窗口已关闭'));}pending.clear();}
      window.addEventListener('message',event=>{
        if(event.source!==window.parent||!isEmbedded)return;const data=event.data;if(!data||data.jsonrpc!=='2.0'||(peerOrigin!=='*'&&event.origin!==peerOrigin))return;
        if(Object.prototype.hasOwnProperty.call(data,'id')&&pending.has(data.id)){const item=pending.get(data.id);clearTimeout(item.timer);pending.delete(data.id);if(event.origin&&event.origin!=='null')peerOrigin=event.origin;if(data.error)item.reject(new Error('操作暂时未完成'));else item.resolve(data.result);return;}
        if(data.method==='ui/notifications/host-context-changed')applyContext(data.params||{});
        if(data.method==='ui/notifications/tool-result'){try{accept(unwrap(data.params));}catch(_){showError();}}
        if(data.method==='ui/resource-teardown'&&data.id!==undefined){window.parent.postMessage({jsonrpc:'2.0',id:data.id,result:{}},peerOrigin);cleanup();}
        if(data.method==='ping'&&data.id!==undefined)window.parent.postMessage({jsonrpc:'2.0',id:data.id,result:{}},peerOrigin);
      });
      function readToken(){const params=new URLSearchParams(location.hash.slice(1));const token=params.get('token');if(token){authToken=token;try{sessionStorage.setItem('work-recap-token',token);}catch(_){}params.delete('token');try{history.replaceState(null,'',location.pathname+location.search+(params.size?'#'+params.toString():''));}catch(_){}}else try{authToken=sessionStorage.getItem('work-recap-token')||'';}catch(_){} }
      async function http(path,body){
        if(!authToken)throw new Error('连接已失效');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);
        try{const response=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+authToken,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store',credentials:'omit',signal:controller.signal});if(!response.ok)throw new Error('回顾服务暂时无法响应');return await response.json();}finally{clearTimeout(timer);}
      }
      async function getState(){return transport==='mcp'?unwrap(await rpc('tools/call',{name:'get_recap',arguments:{}})):await http('/api/state');}
      async function connect(){
        if(isEmbedded){transport='mcp';const result=await rpc('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'work-recap',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen','pip']}},8000);applyContext(result?.hostContext||{});notify('ui/notifications/initialized');}
        else if(isLocalHttp){transport='http';readToken();}else throw new Error('请从工作回顾助手入口打开');
        if(!accept(await getState()))throw new Error('回顾服务暂时没有返回状态');
      }
      async function poll(){
        if(ended||document.hidden||polling||busy||!transport||(!connected&&transport==='mcp'))return;
        polling=true;const version=++requestSequence;
        try{const value=await getState();if(version===requestSequence)accept(value);}catch(_){if(version===requestSequence)showError();}finally{polling=false;}
      }
      async function togglePaused(){
        if(busy||ended||!connected)return;busy=true;++requestSequence;render();
        try{const paused=!current?.paused;const value=transport==='mcp'?unwrap(await rpc('tools/call',{name:'set_recap_paused',arguments:{paused}})):await http('/api/action',{action:paused?'pause':'resume'});if(!accept(value))accept(await getState());}catch(_){showError();}finally{busy=false;render();}
      }
      refs.pause.addEventListener('click',togglePaused);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
      window.addEventListener('pagehide',cleanup,{once:true});
      if(typeof ResizeObserver==='function')new ResizeObserver(()=>{cancelAnimationFrame(sizeFrame);sizeFrame=requestAnimationFrame(()=>notify('ui/notifications/size-changed',{width:document.documentElement.clientWidth,height:document.body.scrollHeight}));}).observe(document.body);
      render();connect().catch(showError);pollTimer=setInterval(poll,20000);
    })();
  </script>
</body>
</html>
